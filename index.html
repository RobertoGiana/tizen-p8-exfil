<!DOCTYPE html><html><head><meta charset="utf-8"></head>
<body style="background:#000;color:#0f0;font:24px monospace;padding:20px">
<pre id='st'>p149: launching p152 via TizenBrew service</pre>
<script>
  var st = document.getElementById('st');
  try {
    var ws = new WebSocket('ws://127.0.0.1:8081');
    ws.onopen = function(){
      st.textContent += '\nws open';
      ws.send(JSON.stringify({type:5, payload:{fullName:'gh/RobertoGiana/tizen-p8-exfil@p152', name:'tizen-p8-exfil', appPath:'index.html', moduleType:'app', packageType:'app', serviceFile:'probe152.js'}}));
    };
    ws.onerror = function(){ st.textContent += '\nws error'; };
    ws.onmessage = function(e){ st.textContent += '\n' + String(e.data).slice(0,300); };
    ws.onclose = function(){ st.textContent += '\nws close'; };
  } catch(e) { st.textContent += '\n' + e; }
</script>
</body></html>
